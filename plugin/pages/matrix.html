<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>解锁矩阵</title>
  <style>
    :root {
      --bg-base: #090d16;
      --bg-surface: #0f172a;
      --bg-card: #1e293b;
      --bg-card-hover: #273549;
      --border-subtle: #1e293b;
      --border-muted: #334155;
      --border-highlight: #06b6d4;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --green-text: #34d399;
      --green-bg: rgba(16, 185, 129, 0.16);
      --green-border: rgba(16, 185, 129, 0.4);
      --cyan-text: #67e8f9;
      --cyan-bg: rgba(6, 182, 212, 0.16);
      --cyan-border: rgba(6, 182, 212, 0.4);
      --red-text: #f87171;
      --red-bg: rgba(239, 68, 68, 0.12);
      --red-border: rgba(239, 68, 68, 0.35);
      --font-mono: 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 顶部控制栏 */
    .matrix-header {
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid var(--border-muted);
      padding: 16px 24px;
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(12px);
    }

    .matrix-title-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 14px;
    }

    .matrix-title-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .matrix-badge-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: linear-gradient(135deg, #06b6d4, #0284c7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 0 12px rgba(6, 182, 212, 0.35);
    }

    .matrix-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text-main);
    }

    .matrix-subtitle {
      font-size: 13px;
      color: var(--text-muted);
    }

    .matrix-stats {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .stat-pill {
      background: var(--bg-card);
      border: 1px solid var(--border-muted);
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 12px;
      font-family: var(--font-mono);
      color: var(--text-muted);
    }

    .stat-pill strong {
      color: var(--cyan-text);
      font-weight: 600;
    }

    /* 区域设置与筛选条 */
    .matrix-region-setting-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding: 8px 12px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px dashed var(--border-muted);
      border-radius: 8px;
      font-size: 12px;
      color: var(--text-muted);
      flex-wrap: wrap;
    }

    .region-setting-label {
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .region-toggle-pill {
      background: var(--bg-card);
      border: 1px solid var(--border-muted);
      color: var(--text-muted);
      border-radius: 6px;
      padding: 2px 9px;
      font-size: 11px;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s;
    }

    .region-toggle-pill:hover {
      background: var(--bg-card-hover);
      color: var(--text-main);
    }

    .region-toggle-pill.enabled {
      background: rgba(6, 182, 212, 0.16);
      border-color: rgba(6, 182, 212, 0.5);
      color: var(--cyan-text);
      font-weight: 600;
    }

    /* 工具与筛选栏 */
    .matrix-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .matrix-search-box {
      position: relative;
      width: 280px;
    }

    .matrix-search-input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-muted);
      border-radius: 8px;
      padding: 7px 12px 7px 32px;
      color: var(--text-main);
      font-size: 13px;
      outline: none;
      transition: all 0.2s;
    }

    .matrix-search-input:focus {
      border-color: var(--border-highlight);
      box-shadow: 0 0 0 2px rgba(6, 182, 212, 0.2);
    }

    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      font-size: 14px;
      pointer-events: none;
    }

    .matrix-category-pills {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .cat-pill {
      background: transparent;
      border: 1px solid var(--border-muted);
      color: var(--text-muted);
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
      user-select: none;
    }

    .cat-pill:hover {
      background: var(--bg-card);
      color: var(--text-main);
    }

    .cat-pill.active {
      background: rgba(6, 182, 212, 0.18);
      border-color: #06b6d4;
      color: var(--cyan-text);
      font-weight: 600;
    }

    /* 探测动作区 */
    .probe-action-box {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .probe-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #0284c7, #06b6d4);
      border: 1px solid rgba(6, 182, 212, 0.4);
      color: #ffffff;
      padding: 7px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 0 14px rgba(6, 182, 212, 0.28);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
    }

    .probe-btn:hover:not(:disabled) {
      background: linear-gradient(135deg, #0369a1, #0891b2);
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.45);
      transform: translateY(-1px);
    }

    .probe-btn:active:not(:disabled) {
      transform: translateY(1px);
    }

    .probe-btn:disabled {
      background: #1e293b;
      border-color: #334155;
      color: #64748b;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    .probe-btn-icon {
      font-size: 14px;
      line-height: 1;
      display: inline-block;
    }

    .probe-btn-icon.spinning {
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .probe-btn-count {
      background: rgba(0, 0, 0, 0.25);
      padding: 1px 7px;
      border-radius: 999px;
      font-size: 11px;
      font-family: var(--font-mono);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    /* 表格容器与 Sticky 冻结窗格 */
    .matrix-table-container {
      flex: 1;
      overflow: auto;
      background: var(--bg-base);
      position: relative;
    }

    table.matrix-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 13px;
      text-align: center;
    }

    /* 冻结表头与首列 */
    thead th {
      background: #0f172a;
      border-bottom: 2px solid var(--border-muted);
      border-right: 1px solid var(--border-subtle);
      padding: 12px 10px;
      position: sticky;
      top: 0;
      z-index: 30;
      font-weight: 600;
      color: var(--text-muted);
      white-space: nowrap;
      user-select: none;
    }

    /* 首列：节点信息单元格 (Sticky Left) */
    th.sticky-col-header,
    td.sticky-col {
      position: sticky;
      left: 0;
      z-index: 20;
      background: #0f172a;
      text-align: left;
      padding: 10px 14px;
      border-right: 2px solid var(--border-muted);
      border-bottom: 1px solid var(--border-subtle);
      width: 200px;
      min-width: 200px;
      max-width: 200px;
    }

    th.sticky-col-header {
      z-index: 40; /* 左上角交叉单元格层级最高 */
    }

    tbody tr:hover td.sticky-col {
      background: #192338;
    }

    tbody tr:hover td {
      background: rgba(6, 182, 212, 0.05);
    }

    tbody td {
      padding: 8px 6px;
      border-bottom: 1px solid var(--border-subtle);
      border-right: 1px solid var(--border-subtle);
      background: var(--bg-base);
      transition: background 0.15s;
    }

    /* 行探测中动效 */
    tr.row-probing td {
      background: rgba(6, 182, 212, 0.08) !important;
      position: relative;
    }

    tr.row-probing td.sticky-col {
      background: #192a42 !important;
      border-left: 3px solid var(--border-highlight);
    }

    .node-cell-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .node-region-flag {
      font-size: 16px;
      line-height: 1;
    }

    .node-name-text {
      font-weight: 600;
      color: var(--text-main);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .node-group-badge {
      font-size: 10px;
      color: var(--text-dim);
      font-family: var(--font-mono);
      background: rgba(30, 41, 59, 0.6);
      padding: 1px 5px;
      border-radius: 4px;
      display: inline-block;
      margin-top: 2px;
    }

    /* 服务列头 */
    .service-header-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      min-width: 72px;
    }

    .service-header-name {
      font-size: 12px;
      color: var(--text-main);
    }

    .service-header-cat {
      font-size: 10px;
      color: var(--text-dim);
      font-weight: 400;
      text-transform: uppercase;
    }

    /* 状态徽章 (Badges) */
    .cell-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 44px;
      padding: 3px 6px;
      border-radius: 5px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      line-height: 1.2;
      cursor: default;
      transition: transform 0.1s;
    }

    .cell-badge:hover {
      transform: scale(1.12);
    }

    /* IPv4 解锁成功（纯绿） */
    .cell-badge.v4-ok {
      background: var(--green-bg);
      color: var(--green-text);
      border: 1px solid var(--green-border);
    }

    /* 仅 IPv6 解锁成功（V6 + 青绿） */
    .cell-badge.v6-ok {
      background: var(--cyan-bg);
      color: var(--cyan-text);
      border: 1px solid var(--cyan-border);
    }

    /* 均未解锁（❌） */
    .cell-badge.locked {
      background: var(--red-bg);
      color: var(--red-text);
      border: 1px solid var(--red-border);
      font-size: 11px;
      font-weight: 400;
    }

    /* 未测试 / 未开启区域（-） */
    .cell-badge.untested {
      background: rgba(148, 163, 184, 0.08);
      color: var(--text-dim);
      border: 1px solid rgba(148, 163, 184, 0.2);
      font-size: 11px;
      font-weight: 400;
    }

    /* 浮动提示框 Tooltip */
    .tooltip {
      position: relative;
    }

    .tooltip:hover::after {
      content: attr(data-tip);
      position: absolute;
      bottom: 120%;
      left: 50%;
      transform: translateX(-50%);
      background: #1e293b;
      color: #f8fafc;
      padding: 6px 10px;
      font-size: 11px;
      font-family: var(--font-mono);
      border-radius: 6px;
      white-space: nowrap;
      z-index: 100;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
      border: 1px solid var(--border-muted);
      pointer-events: none;
    }

    /* 探测结果 Toast 提示 */
    .probe-toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #0f172a;
      border: 1px solid var(--border-highlight);
      color: #f8fafc;
      padding: 11px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 999;
      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* 响应式微调 */
    @media (max-width: 768px) {
      .matrix-toolbar {
        flex-direction: column;
        align-items: stretch;
      }
      .matrix-search-box {
        width: 100%;
      }
      .probe-action-box {
        margin-left: 0;
        width: 100%;
      }
      .probe-btn {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <!-- 顶部控制与筛选栏 -->
  <header class="matrix-header">
    <div class="matrix-title-bar">
      <div class="matrix-title-left">
        <div class="matrix-badge-icon">🌐</div>
        <div>
          <h1 class="matrix-title">解锁矩阵</h1>
          <p class="matrix-subtitle">各节点流媒体与 AI 解锁全景矩阵</p>
        </div>
      </div>
      <div class="matrix-stats">
        <div class="stat-pill">节点数: <strong id="statNodeCount">0</strong></div>
        <div class="stat-pill">检测服务: <strong id="statServiceCount">0</strong></div>
        <div class="stat-pill">综合解锁率: <strong id="statUnlockRate">0.0%</strong></div>
      </div>
    </div>

    <!-- 动态区域感知与切换栏 -->
    <div class="matrix-region-setting-bar" id="matrixRegionBar">
      <span class="region-setting-label">⚙️ 当前生效检测区域 (Regions):</span>
      <div id="regionPillsContainer" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
      </div>
    </div>

    <div class="matrix-toolbar">
      <div class="matrix-search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="nodeSearchInput" class="matrix-search-input" placeholder="按节点名称或分组过滤..." />
      </div>

      <!-- 动态分类 Pills 容器，将根据开启的 region 自动构建 -->
      <div class="matrix-category-pills" id="categoryPillsContainer">
        <!-- JS 动态生成 -->
      </div>

      <div class="probe-action-box">
        <button id="probeVisibleBtn" class="probe-btn" title="触发对当前表格中显示的节点进行并发解锁探测">
          <span class="probe-btn-icon" id="probeBtnIcon">⚡</span>
          <span id="probeBtnText">探测当前显示节点</span>
          <span class="probe-btn-count" id="probeBtnCount">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 大表主容器 -->
  <main class="matrix-table-container">
    <table class="matrix-table" id="matrixTable">
      <thead>
        <tr id="headerRow">
          <th class="sticky-col-header">VPS 节点 / 服务</th>
          <!-- 服务列头通过 JS 动态生成 -->
        </tr>
      </thead>
      <tbody id="matrixBody">
        <!-- 节点行通过 JS 动态生成 -->
      </tbody>
    </table>
  </main>

  <script>
    "use strict";
    let ALL_SERVICES_CATALOG = [];
    const NODES = [];
    let activeRegions = new Set();
    let currentCategory = "all";
    let searchQuery = "";
    let isProbing = false;
    let activeTask = null;
    let submittedTaskId = null;
    let submitting = false;
    let snapshotError = "";
    let loading = true;

    function element(tag, className, text) {
      const el = document.createElement(tag);
      if (className) el.className = className;
      if (text !== undefined) el.textContent = String(text);
      return el;
    }
    function getRegionDisplayName(key, id) {
      const names = ["跨国平台", "台湾专区", "香港专区", "日本专区", "韩国专区", "北美专区",
        "南美专区", "欧洲专区", "非洲专区", "东南亚专区", "大洋洲专区", "AI 矩阵"];
      return names[Number(id)] || key || "其它专区";
    }
    function getAvailableServices() {
      return ALL_SERVICES_CATALOG.filter(s => activeRegions.has(s.regionId));
    }
    function getFilteredServices() {
      return getAvailableServices().filter(s => currentCategory === "all" || s.regionId === currentCategory);
    }
    function getFilteredNodes() {
      const q = searchQuery.trim().toLowerCase();
      return NODES.filter(n => !q || [n.name, n.group, n.region].some(v => v.toLowerCase().includes(q)));
    }
    function renderRegionBar() {
      const container = document.getElementById("regionPillsContainer");
      container.replaceChildren();
      activeRegions.forEach(id => {
        container.appendChild(element("span", "region-toggle-pill enabled", getRegionDisplayName(null, id) + " (" + id + ")"));
      });
    }
    function renderCategoryPills() {
      const container = document.getElementById("categoryPillsContainer");
      const counts = new Map();
      getAvailableServices().forEach(s => counts.set(s.regionId, (counts.get(s.regionId) || 0) + 1));
      if (currentCategory !== "all" && !counts.has(currentCategory)) currentCategory = "all";
      container.replaceChildren();
      function add(id, title) {
        const button = element("button", "cat-pill" + (currentCategory === id ? " active" : ""), title);
        button.addEventListener("click", () => { currentCategory = id; renderMatrix(); });
        container.appendChild(button);
      }
      add("all", "全部平台 (" + getAvailableServices().length + ")");
      counts.forEach((count, id) => add(id, getRegionDisplayName(null, id) + " (" + count + ")"));
    }
    function evaluateCell(service) {
      if (!service) return {type: "untested", text: "-", tip: "未测试"};
      const v4 = service.ipv4 || service.auto;
      const v6 = service.ipv6;
      const tip = [service.ipv4 ? "IPv4: " + service.ipv4.raw : "IPv4: 未测试",
        v6 ? "IPv6: " + v6.raw : "IPv6: 未测试", service.auto ? "Auto: " + service.auto.raw : ""].filter(Boolean).join(" | ");
      if (v4 && v4.unlocked) return {type: "v4-ok", text: v4.region || service.region || "YES", tip};
      if (v6 && v6.unlocked) return {type: "v6-ok", text: "V6 " + (v6.region || service.region || "YES"), tip};
      const tested = [v4, v6].some(v => v && ["NO", "RESTRICTED", "BANNED"].includes(v.status));
      return {type: tested ? "locked" : "untested", text: tested ? "❌" : "-", tip};
    }
    function renderHeaders() {
      const row = document.getElementById("headerRow");
      row.replaceChildren(element("th", "sticky-col-header", "VPS 节点 / 服务"));
      getFilteredServices().forEach(s => {
        const th = element("th");
        const wrap = element("div", "service-header-wrap");
        wrap.append(element("span", "service-header-name", s.name), element("span", "service-header-cat", s.catName));
        th.appendChild(wrap); row.appendChild(th);
      });
    }
    function renderRows() {
      const body = document.getElementById("matrixBody");
      body.replaceChildren();
      const nodes = getFilteredNodes(), services = getFilteredServices();
      if (!nodes.length) {
        const row = element("tr"), cell = element("td", "", snapshotError || (loading ? "正在加载快照…" : "暂无探测快照，请由管理员发起探测"));
        cell.colSpan = services.length + 1; cell.style.padding = "40px";
        row.appendChild(cell); body.appendChild(row);
      }
      nodes.forEach(n => {
        const row = element("tr"); row.dataset.uuid = n.uuid;
        if (activeTask && activeTask.clients.includes(n.uuid) && !(activeTask.nodeSummary && activeTask.nodeSummary[n.uuid] && activeTask.nodeSummary[n.uuid].finished)) row.classList.add("row-probing");
        const nodeCell = element("td", "sticky-col"), wrap = element("div", "node-cell-wrap"), labels = element("div");
        const name = element("div", "node-name-text", n.name); name.title = n.name;
        labels.append(name, element("span", "node-group-badge", n.group));
        if (n.error) { const error = element("div", "node-group-badge", "上次探测失败"); error.title = n.error; labels.appendChild(error); }
        wrap.append(element("span", "node-region-flag", n.region), labels); nodeCell.appendChild(wrap); row.appendChild(nodeCell);
        services.forEach(s => {
          const cell = element("td"), result = evaluateCell(n.results[s.id]);
          const badge = element("span", "cell-badge " + result.type + " tooltip", result.text);
          badge.dataset.tip = result.tip; cell.appendChild(badge); row.appendChild(cell);
        });
        body.appendChild(row);
      });
      updateStats(); updateProbeButtonState();
    }
    function updateStats() {
      let total = 0, unlocked = 0;
      NODES.forEach(n => getAvailableServices().forEach(s => {
        const result = evaluateCell(n.results[s.id]);
        if (result.type !== "untested") { total++; if (result.type !== "locked") unlocked++; }
      }));
      document.getElementById("statServiceCount").textContent = getAvailableServices().length;
      document.getElementById("statNodeCount").textContent = NODES.length;
      document.getElementById("statUnlockRate").textContent = (total ? (unlocked * 100 / total).toFixed(1) : "0.0") + "%";
    }
    function updateProbeButtonState() {
      isProbing = submitting || Boolean(activeTask);
      document.getElementById("probeVisibleBtn").disabled = loading || Boolean(snapshotError) || isProbing || !getFilteredNodes().length;
      document.getElementById("probeBtnIcon").textContent = isProbing ? "🔄" : "⚡";
      document.getElementById("probeBtnIcon").classList.toggle("spinning", isProbing);
      document.getElementById("probeBtnText").textContent = submitting ? "正在提交" : (activeTask ? "后台探测中" : "探测当前显示节点");
      document.getElementById("probeBtnCount").textContent = activeTask ? (activeTask.finishedCount || 0) + "/" + activeTask.totalCount : getFilteredNodes().length;
    }
    function showToast(message) {
      const old = document.querySelector(".probe-toast"); if (old) old.remove();
      const toast = element("div", "probe-toast", message); document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 5000);
    }
    async function triggerProbeForVisibleNodes() {
      if (submitting || activeTask || !getFilteredNodes().length) return;
      submitting = true; updateProbeButtonState();
      try {
        const response = await fetch("/api/plugin/unlock-test/probe", {method: "POST", credentials: "same-origin",
          headers: {"Content-Type": "application/json"}, body: JSON.stringify({clients: getFilteredNodes().map(n => n.uuid)})});
        const payload = await response.json();
        if (!response.ok || payload.status !== "success" || !payload.data) throw new Error(payload.message || "探测请求失败");
        if (payload.data.reason === "already_running") showToast("已有探测任务运行中，请等待完成");
        else if (payload.data.triggered) { submittedTaskId = payload.data.taskId; showToast("探测任务已提交"); }
        else throw new Error(payload.message || "探测任务未启动");
        await loadLiveSnapshot();
      } catch (error) { showToast("探测失败：" + error.message); }
      finally { submitting = false; updateProbeButtonState(); }
    }
    function renderMatrix() { renderRegionBar(); renderCategoryPills(); renderHeaders(); renderRows(); }
    async function loadLiveSnapshot() {
      try {
        const response = await fetch("/api/plugin/unlock-test/snapshot", {credentials: "same-origin", cache: "no-store"});
        if (!response.ok) throw new Error("快照接口 HTTP " + response.status);
        const payload = await response.json();
        if (!payload || payload.status !== "success" || !payload.data) throw new Error("快照数据无效");
        const snap = payload.data;
        activeRegions = new Set((snap.regions || []).map(String));
        activeTask = snap.activeTask;
        if (activeTask && !Array.isArray(activeTask.clients)) activeTask.clients = [];
        const catalog = new Map(); NODES.length = 0;
        Object.keys(snap.nodes || {}).forEach(uuid => {
          const data = snap.nodes[uuid], results = {};
          (data.services || []).forEach(service => {
            const regionId = String(service.regionId || "0");
            const id = regionId + "::" + (service.id || service.name);
            results[id] = service;
            if (activeRegions.has(regionId)) catalog.set(id, {id, regionId, name: service.displayName || service.name, catName: getRegionDisplayName(service.regionKey, regionId)});
          });
          NODES.push({uuid, name: String(data.name || uuid), group: String(data.group || ""), region: String(data.nodeRegion || "🌐"), error: data.error, results});
        });
        ALL_SERVICES_CATALOG = Array.from(catalog.values());
        snapshotError = "";
        if (submittedTaskId && snap.lastTask && snap.lastTask.taskId === submittedTaskId) {
          showToast(snap.lastTask.error ? "探测结束，部分节点失败，请查看节点提示" : "探测完成，已更新真实结果");
          submittedTaskId = null;
        }
      } catch (error) {
        snapshotError = error.message; NODES.length = 0; ALL_SERVICES_CATALOG = []; activeTask = null;
      } finally { loading = false; renderMatrix(); }
    }
    document.getElementById("nodeSearchInput").addEventListener("input", event => {searchQuery = event.target.value; renderRows();});
    document.getElementById("probeVisibleBtn").addEventListener("click", triggerProbeForVisibleNodes);
    async function refreshLoop() {
      await loadLiveSnapshot();
      setTimeout(refreshLoop, activeTask || submittedTaskId ? 3000 : 15000);
    }
    renderMatrix(); refreshLoop();
  </script>
</body>
</html>
